<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c12" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f3f4f9" media="(prefers-color-scheme: light)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Todo">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="stylesheet" href="/styles.css">
  <title>Todo</title>
</head>
<body>
  <div id="app">
    <header class="top">
      <div class="top-actions">
        <a href="/sessions" class="icon-btn" id="sessions-link" aria-label="Sessions" title="Sessions" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>
        </a>
        <button type="button" class="icon-btn" id="logout-btn" aria-label="Sign out" title="Sign out" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3M16 17l5-5-5-5M21 12H9"/></svg>
        </button>
      </div>
      <h1 id="view-title">Todo</h1>
      <p id="view-subtitle" class="subtitle"></p>
    </header>

    <section id="auth-gate" class="card auth-card" hidden>
      <p class="muted">Sign in to see your list.</p>
      <div class="stack" id="auth-buttons"></div>
    </section>

    <section id="main" hidden>
      <div class="segmented" role="group" aria-label="Show">
        <button type="button" class="chip active" data-status="open">Open</button>
        <button type="button" class="chip" data-status="done">Done</button>
        <button type="button" class="chip" data-status="all">All</button>
      </div>

      <nav id="tag-chips" class="tag-chips" aria-label="Filter by tag"></nav>

      <div id="groups"></div>

      <div id="empty" class="empty" hidden>
        <svg class="empty-art" viewBox="0 0 120 120" aria-hidden="true">
          <circle cx="60" cy="60" r="46" class="empty-ring"/>
          <path d="M40 61l14 14 27-30" class="empty-check"/>
          <circle cx="98" cy="26" r="5" class="empty-dot a"/>
          <circle cx="20" cy="88" r="4" class="empty-dot b"/>
          <circle cx="102" cy="92" r="3" class="empty-dot c"/>
        </svg>
        <p id="empty-title" class="empty-title"></p>
        <p id="empty-copy" class="muted"></p>
      </div>
    </section>
  </div>

  <button type="button" id="fab" class="fab" aria-label="New todo" hidden>
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <div id="sheet-backdrop" class="backdrop"></div>
  <form id="add-form" class="sheet" inert>
    <div class="grabber" aria-hidden="true"></div>
    <input id="title-input" type="text" placeholder="Add a todo…" autocomplete="off" required maxlength="500">
    <input id="tags-input" type="text" placeholder="tags (comma)" autocomplete="off" autocapitalize="off">
    <div id="tag-suggestions" class="suggestions"></div>
    <div class="sheet-actions">
      <span class="muted small">Press Enter to add</span>
      <button type="submit" class="send">Add</button>
    </div>
  </form>

  <script src="/app.js"></script>
</body>
</html>
